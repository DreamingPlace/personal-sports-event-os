[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-sports-event-os"
version = "1.0.0"
description = "Offline synthetic sports-event modeling and release quality gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]

[project.scripts]
sports-os = "sports_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

